[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pkgname"
version = "0.1.0"
description = "Check whether a PyPI package name is available, and suggest safe alternatives."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["pypi", "package-name", "availability", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[[project.authors]]
name = "Isaac Onagh"
email = "hellboynaz@gmail.com"

[project.optional-dependencies]
cache = ["msgpack>=1.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "msgpack>=1.0",
]

[project.scripts]
pkgname = "pkgname.cli:main"

[project.urls]
Homepage = "https://github.com/i4147/pkgname"
Repository = "https://github.com/i4147/pkgname"
Issues = "https://github.com/i4147/pkgname/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: hits the real PyPI JSON API (requires PKGNAME_RUN_INTEGRATION=1)",
    "integration_index: loads the real ./pip.json (requires PKGNAME_RUN_INTEGRATION=1)",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "W"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "msgpack"
ignore_missing_imports = true