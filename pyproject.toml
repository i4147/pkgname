[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pkgname"
version = "0.1.0"
description = "A minimal Python command-line application."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
dependencies = []

[project.scripts]
pkgname = "pkgname:main"

[tool.setuptools]
py-modules = ["pkgname"]
